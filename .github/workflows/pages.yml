name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy midway; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages must be enabled once by a human (repo admin): Settings -> Pages ->
      # "Build and deployment" -> Source: GitHub Actions. GITHUB_TOKEN cannot
      # create the Pages site itself, so deploy-pages fails with "failed to
      # create deployment (status: 404)" until that one-time toggle is set.
      # enablement: true is kept so a re-enable after accidental disable heals.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
