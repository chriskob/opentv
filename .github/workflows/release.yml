name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testReleaseUnitTest

      # Only runs if a keystore has been added to repository secrets. Without one the
      # release build falls back to the debug key, which still produces an installable
      # APK — see docs/RELEASING.md.
      # The secrets context is not usable directly in an `if:`, so it is lifted into env first.
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Assemble release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # A stable asset name matters: the install page and the /apk short link both look for
      # a file ending in .apk, and a predictable name keeps direct links working.
      - name: Name the artifact
        id: artifact
        run: |
          TAG="${GITHUB_REF_NAME}"
          SOURCE=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$SOURCE" ]; then
            echo "::error::No APK was produced by assembleRelease"
            exit 1
          fi
          mkdir -p dist
          cp "$SOURCE" "dist/opentv-${TAG}.apk"
          echo "path=dist/opentv-${TAG}.apk" >> "$GITHUB_OUTPUT"
          echo "signed=$([ -n "$KEYSTORE_PATH" ] && echo yes || echo debug-key)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.artifact.outputs.path }}
          generate_release_notes: true
          body: |
            Built by GitHub Actions from the tagged commit. The workflow that produced this
            APK is public, so you can verify it against the source rather than taking anyone's
            word for it.

            **Install:** see the [install page](../../) or sideload the APK directly.

            Signing: `${{ steps.artifact.outputs.signed }}`. A build signed with the debug key
            is installable and safe to test, but cannot be upgraded in place once the project
            moves to a real keystore — see `docs/RELEASING.md`.
