name: Baseline profile

# Manual on purpose. Recording a profile needs a real device or an emulator, which is minutes of CI
# rather than seconds, and the result is a file that gets committed — so it runs when someone asks for
# it, not on every push. Uncomment the schedule once the profile is being regenerated regularly; the
# profile goes stale as the UI changes, and a stale one is worse than none because it pre-compiles
# code paths that no longer exist.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  profile:
    name: Record baseline profile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Deliberately NOT passing -PdevMinSdk here: the profile is recorded against the same minSdk
      # the release APK uses, because a profile recorded on a different variant is a profile for a
      # different app.
      - name: Record the profile on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none
          script: ./gradlew :app:generateBaselineProfile --stacktrace

      - name: Upload the recorded profile
        uses: actions/upload-artifact@v4
        with:
          name: baseline-profile
          path: app/src/**/generated/baselineProfiles/*.txt
          if-no-files-found: error

      # The profile is committed by a human, not by this job: it is a source file that every release
      # carries, and nobody should discover a rewritten one in a diff they did not ask for.
      - name: What to do with it
        run: |
          echo "Download the artifact, put baseline-prof.txt in"
          echo "app/src/release/generated/baselineProfiles/, and commit it."
